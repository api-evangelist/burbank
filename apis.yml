name: Burbank
description: Burbank is a Cardiff and London based payments technology company that builds
  card-present authentication for online and remote payments. Its flagship Card Present
  Over Internet (CPoI) technology lets consumers authenticate anywhere using the globally
  familiar "tap and PIN" gesture, alongside a SoftPOS product and an Issuer Toolkit for
  identity verification. Burbank ships a white-label SDK (mobile library plus containerized
  backend services) to issuers, acquirers, and payment service providers to reduce online
  fraud and improve conversion. Backed by Anthemis, Mouro Capital, and Portfolio Ventures.
